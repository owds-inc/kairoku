name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install
      - run: bun test
      - run: bunx tsc --noEmit
      - name: host-target build
        run: bun build --compile src/cli/main.ts --outfile dist/kairoku && ./dist/kairoku version
